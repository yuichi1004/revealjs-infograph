name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # The palette's contrast / CVD floors are asserted by palette.test.js above;
      # this prints the full table so a failing run shows *which* pair regressed.
      - run: npm run validate:palette
      - run: npm run build

  # The visual suite runs in the same container the screenshot baselines were
  # generated in — see scripts/visual-docker.sh for why that has to be pinned.
  # `container:` means the browsers are already present, so no install step.
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
